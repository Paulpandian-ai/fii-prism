name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: Node (lint + typecheck + cdk synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Web lint
        run: pnpm --filter @fii/web lint --max-warnings=0

      - name: CDK synth
        run: pnpm --filter @fii/infra synth

  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fii
          POSTGRES_PASSWORD: fii_local_dev
          POSTGRES_DB: fii_prism
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fii:fii_local_dev@localhost:5432/fii_prism?client_encoding=utf8
      FII_USE_FAKE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.17"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
