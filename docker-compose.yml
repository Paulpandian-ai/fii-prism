services:
  postgres:
    # pgvector/pgvector ships Postgres 16 with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: fii-prism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fii_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fii_prism}
    ports:
      - "5432:5432"
    volumes:
      - fii_pg_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fii} -d ${POSTGRES_DB:-fii_prism}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fii_pg_data:
