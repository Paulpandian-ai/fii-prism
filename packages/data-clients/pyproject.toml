[project]
name = "fii-data-clients"
version = "0.1.0"
description = "Thin provider wrappers: Polygon, FMP, edgartools, FRED, Finnhub."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.4",
    "structlog>=24.4.0",
    "fii-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fii_data_clients"]

[tool.uv.sources]
fii-shared = { workspace = true }
