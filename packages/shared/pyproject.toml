[project]
name = "fii-shared"
version = "0.1.0"
description = "Shared Pydantic schemas and domain types for FII-PRISM."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fii_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
