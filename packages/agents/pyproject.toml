[project]
name = "fii-agents"
version = "0.1.0"
description = "LangGraph orchestrator and specialist agents for FII-PRISM."
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.42.0",
    "langgraph>=0.2.61",
    "langgraph-checkpoint-postgres>=2.0.7",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.10.4",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "fii-shared",
    "fii-db",
    "fii-data-clients",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fii_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
fii-shared = { workspace = true }
fii-db = { workspace = true }
fii-data-clients = { workspace = true }
