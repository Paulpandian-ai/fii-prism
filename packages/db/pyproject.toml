[project]
name = "fii-db"
version = "0.1.0"
description = "SQLAlchemy models and session helpers for FII-PRISM. Single source of truth for the DB schema."
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fii_db"]
