[project]
name = "fii-prism-workspace"
version = "0.1.0"
description = "FII-PRISM — Factor Impact Intelligence v2 (Python workspace root)"
requires-python = ">=3.11,<3.13"
# Workspace root only — no installable package. Members declare their own dependencies.
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/ingest",
    "packages/agents",
    "packages/db",
    "packages/shared",
    "packages/data-clients",
]

[tool.uv.sources]
fii-shared = { workspace = true }
fii-db = { workspace = true }
fii-agents = { workspace = true }
fii-data-clients = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# Ordering matters: packages first, then apps. The TestClient-driven api tests share
# a process-wide event loop with leftover background tasks; running pure-package tests
# first keeps that state minimal and avoids the lifespan-rebuild deadlock we hit when
# api tests come before agents tests on the same loop.
testpaths = ["packages", "apps/ingest", "apps/api"]
python_files = ["test_*.py", "*_test.py"]
