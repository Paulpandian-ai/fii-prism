[project]
name = "fii-ingest"
version = "0.1.0"
description = "FII-PRISM ingestion CLI and scheduled job runners. Ships as its own Fargate image."
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "boto3>=1.35.89",
    "tiktoken>=0.8.0",
    "fii-shared",
    "fii-db",
    "fii-data-clients",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.2",
]

[project.scripts]
fii-ingest = "fii_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fii_ingest"]

[tool.uv.sources]
fii-shared = { workspace = true }
fii-db = { workspace = true }
fii-data-clients = { workspace = true }
