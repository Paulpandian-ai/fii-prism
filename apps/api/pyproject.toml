[project]
name = "fii-api"
version = "0.1.0"
description = "FII-PRISM FastAPI backend. Serves sync reads and triggers the Step Functions orchestrator."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    # Multipart upload parser used by /critiques/upload (PDF). FastAPI's
    # File / Form / UploadFile depend on it.
    "python-multipart>=0.0.18",
    "fii-shared",
    "fii-db",
    "fii-agents",
    "fii-data-clients",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
fii-shared = { workspace = true }
fii-db = { workspace = true }
fii-agents = { workspace = true }
fii-data-clients = { workspace = true }
